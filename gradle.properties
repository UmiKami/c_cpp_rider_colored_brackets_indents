pluginVersion=1.0.1

# Compile against the locally installed Rider instead of downloading an SDK.
riderPath=D:/jetbrains_ides/Rider

# Rider 2026.2 is built for Java 25; use Rider's bundled JBR as the compile toolchain.
org.gradle.java.installations.paths=D:/jetbrains_ides/Rider/jbr
org.gradle.java.installations.auto-download=false

kotlin.stdlib.default.dependency=false
org.gradle.configuration-cache=true
